<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book · Open Margins</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<script src="prefs.js?v=dev"></script>
<script src="books.js?v=dev"></script>
<link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <a class="bar-title" href="index.html"><span class="logo" aria-hidden="true"></span>Open Margins</a>
    <nav class="running" aria-label="Breadcrumb"><span id="crumb-book">Book</span></nav>
    <span class="bar-spacer"></span>
    <button type="button" class="bar-button" data-theme-toggle>Dark mode</button>
  </div>
  <div class="rule-double"></div>
</header>
<main class="page">
  <header class="title-block with-cover">
    <div class="cover" id="cover" aria-hidden="true"></div>
    <div>
      <h1 id="book-title">Book</h1>
      <p class="by" id="book-by"></p>
      <p class="blurb" id="book-blurb"></p>
    </div>
  </header>

  <h2 class="sr-only">Search</h2>
  <div id="book-search"></div>

  <figure class="plate book-frontispiece" id="frontispiece-lord-jim" hidden>
    <div class="plate-mount">
      <img src="art/temeraire-900.jpg" srcset="art/temeraire-900.jpg 900w, art/temeraire-1800.jpg 1800w"
           sizes="(max-width: 700px) 90vw, 36rem" width="900" height="669" loading="lazy"
           alt="At sunset an old wooden warship, pale and ghostly, is towed up a calm river by a small dark steam tug with a tall smoking funnel.">
    </div>
    <figcaption><span class="plate-no">Frontispiece.</span> J. M. W. Turner, <em>The Fighting Temeraire</em>, 1839. National Gallery, London; public domain.</figcaption>
  </figure>

  <figure class="plate book-frontispiece" id="frontispiece-heart-of-darkness" hidden>
    <div class="plate-mount">
      <img src="art/charon-900.jpg" srcset="art/charon-900.jpg 900w, art/charon-1800.jpg 1800w"
           sizes="(max-width: 700px) 90vw, 36rem" width="900" height="737" loading="lazy"
           alt="A crowd of naked, huddled figures is driven onto a boat by a man with a raised oar, to cross a dark river beneath black cliffs.">
    </div>
    <figcaption><span class="plate-no">Frontispiece.</span> Gustave Doré, <em>Charon Herds the Sinners onto His Boat</em>, illustration for Dante’s <em>Inferno</em>, Canto III, 1861 (engraving). Public domain.</figcaption>
  </figure>

  <figure class="plate book-frontispiece" id="frontispiece-ivan-ilyich" hidden>
    <div class="plate-mount" style="max-width: 24rem; margin-left: auto; margin-right: auto;">
      <img src="art/kramskoi-620.jpg" width="620" height="1022" loading="lazy"
           alt="A widow in a long black dress stands in a dim drawing-room, pressing a handkerchief to her mouth, beside a coffin heaped with flowers.">
    </div>
    <figcaption><span class="plate-no">Frontispiece.</span> Ivan Kramskoi, <em>Inconsolable Grief</em>, 1884. Public domain.</figcaption>
  </figure>

  <figure class="plate book-frontispiece" id="frontispiece-bartleby" hidden>
    <div class="plate-mount" style="max-width: 26rem; margin-left: auto; margin-right: auto;">
      <img src="art/wallst-800.jpg" srcset="art/wallst-800.jpg 800w, art/wallst-1400.jpg 1400w"
           sizes="(max-width: 700px) 90vw, 24rem" width="800" height="1012" loading="lazy"
           alt="A crowd of men in top hats presses together on a Wall Street sidewalk under a stormy sky, with the spire of Trinity Church at the end of the street.">
    </div>
    <figcaption><span class="plate-no">Frontispiece.</span> James H. Cafferty and Charles G. Rosenberg, <em>Wall Street, Half Past Two, October 13, 1857</em>, 1858. Metropolitan Museum of Art; public domain.</figcaption>
  </figure>

  <figure class="plate book-frontispiece" id="frontispiece-romantic-poets" hidden>
    <div class="plate-mount">
      <img src="art/shelley-800.jpg" srcset="art/shelley-800.jpg 800w, art/shelley-1200.jpg 1200w"
           sizes="(max-width: 700px) 90vw, 36rem" width="800" height="635" loading="lazy"
           alt="A young man in a loose white shirt sits writing among the huge ruined arches of an ancient Roman bath, overgrown with plants under a blue sky.">
    </div>
    <figcaption><span class="plate-no">Frontispiece.</span> Joseph Severn, <em>Shelley Composing Prometheus Unbound in the Baths of Caracalla</em> (1845). Public domain.</figcaption>
  </figure>

  <figure class="plate book-frontispiece" id="frontispiece-billy-budd" hidden>
    <div class="plate-mount">
      <img src="art/pocock-800.jpg" srcset="art/pocock-800.jpg 800w, art/pocock-944.jpg 944w"
           sizes="(max-width: 700px) 90vw, 36rem" width="800" height="543" loading="lazy"
           alt="Two sailing warships in a heavy sea after a battle, one still afloat under torn sails and the other sinking, with sailors in the water and small boats rescuing survivors.">
    </div>
    <figcaption><span class="plate-no">Frontispiece.</span> After Nicholas Pocock, <em>The Brunswick and the Sinking Vengeur after the Battle of the Glorious First of June, 1794</em>. Public domain.</figcaption>
  </figure>

  <figure class="plate book-frontispiece" id="frontispiece-siddhartha" hidden>
    <div class="plate-mount">
      <img src="art/ganges-800.jpg" srcset="art/ganges-800.jpg 800w, art/ganges-1000.jpg 1000w"
           sizes="(max-width: 700px) 90vw, 36rem" width="800" height="546" loading="lazy"
           alt="Boats float on the Ganges in front of the tall stone buildings and temples of Benares under a deep blue sky, the water reflecting red and gold.">
    </div>
    <figcaption><span class="plate-no">Frontispiece.</span> Edwin Lord Weeks, <em>The Barge of the Maharaja of Benares</em>. Public domain.</figcaption>
  </figure>

  <h2 id="contents-head">Contents</h2>
  <ol class="contents" id="toc"></ol>
  <p class="type-pointer" id="type-pointer"></p>

  <p class="foot" id="book-foot"></p>
</main>
<script src="search.js?v=dev"></script>
<script>
  const params = new URLSearchParams(location.search);
  const bookId = window.OMBOOKS[params.get('book')] ? params.get('book') : 'lord-jim';
  const b = window.OMBOOKS[bookId];
  const unit = b.unit.toLowerCase();
  document.title = b.title + ' \u00b7 Open Margins';
  document.getElementById('crumb-book').textContent = b.title;
  const cover = document.getElementById('cover');
  cover.style.setProperty('--cloth', b.cloth);
  cover.innerHTML = '<span class="cover-frame"><span class="cover-title' + (b.coverClass ? ' ' + b.coverClass : b.title.length > 20 ? ' xlong' : b.title.length > 10 ? ' long' : '') + '">' + (b.coverTitle || b.title.replace(/ of /, ' of<br>')) + '</span><span class="cover-rule"></span><span class="cover-sub">' + b.sub + '</span><span class="cover-author">' + b.author + '</span><span class="logo"></span></span>';
  document.getElementById('book-title').textContent = b.title;
  document.getElementById('book-by').innerHTML = b.sub + ' \u00b7 by <em>' + b.author + '</em> \u00b7 ' + b.year;
  document.getElementById('book-blurb').textContent = b.blurb;
  const fr = document.getElementById('frontispiece-' + bookId); if (fr) fr.hidden = false;
  document.getElementById('type-pointer').innerHTML = (b.verse ? 'Want to learn these poems by heart? ' : (b.translator || b.translated) ? 'Want to learn the prose by hand? ' : 'Want to learn ' + b.author.split(' ').pop() + '\u2019s diction by hand? ') + '<a href="type.html?book=' + bookId + '&amp;ch=1">Type through the book</a>, a ' + unit + ' at a time; each ' + unit + ' has a <em>Type</em> button.';
  document.getElementById('book-foot').innerHTML = 'Text: ' + (b.translator ? 'translated by ' + b.translator + ', ' : '') + (b.textSource || 'Project Gutenberg eBook #' + b.gutenberg + ', public domain.') +
    (bookId === 'lord-jim' ? ' The Author\u2019s Note (1917) is not included in the reader.' : '') +
    (b.textNote ? ' ' + b.textNote : '') +
    ' <a href="sources.html?book=' + bookId + '">Sources for the notes</a> \u00b7 <a href="index.html">Back to the library</a> \u00b7 <a href="https://github.com/samcao920/scholia">GitHub</a>.';
</script>
<script>
  const q0 = params.get('q');
  OMSearch.mount(document.getElementById('book-search'), { book: bookId, id: 'q-book', initial: q0 });
  const toc = document.getElementById('toc');
  for (let n = 1; n <= b.chapters; n++) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="what"><a href="chapter.html?book=' + bookId + '&amp;ch=' + n + '">' + b.unit + ' ' + n + (b.titles ? ': ' + b.titles[n - 1] : '') + '</a></span>';
    toc.appendChild(li);
  }
</script>
</body>
</html>
