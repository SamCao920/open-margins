name: Inspect Curius CSS (temporary)
on:
  push:
    paths: ['.github/workflows/inspect-ext.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -o ext.crx "https://clients2.google.com/service/update2/crx?response=redirect&prodversion=130.0&acceptformat=crx2,crx3&x=id%3Dfbpnbdifockifjiimogdjndhpmmfgjkl%26uc"
          ls -la ext.crx
          mkdir ext && (cd ext && unzip -q ../ext.crx || true)
          find ext -type f | head -50
          cat ext/manifest.json | head -80
          echo "=== class names that collide ==="
          for c in spread title-page lede cover book library mount plate folio wordmark subtitle imprint logo leader meta title author primary-action contents-head home-top text-button colophon rule-double; do
            n=$(grep -rhoE "\.$c([^a-zA-Z0-9_-]|$)" ext --include=*.css --include=*.js | wc -l); echo "$c: $n"; done
          echo "=== white-space / nowrap rules ==="
          grep -rhoE "[^{}]{0,200}\{[^}]*white-space[^}]*\}" ext --include=*.css | head -40
          echo "=== js-injected nowrap ==="
          grep -rhoE ".{0,200}nowrap.{0,120}" ext --include=*.js | head -30
