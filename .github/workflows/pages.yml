name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check notes
        run: python3 scripts/check_notes.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r texts notes _site/
          # Cache-bust scripts and styles: browsers keep Pages files for
          # 10 minutes, and a stale script on a new page breaks the reader.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/*.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
